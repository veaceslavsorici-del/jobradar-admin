<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' https://telegram.org; style-src 'self'; img-src 'self' data:; connect-src https://grgsfcutzcyflnqogkbj.supabase.co; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<title>JobRadar — админка</title>
<link rel="stylesheet" href="admin.v1.css">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="app.v1.js" defer></script>
</head>
<body class="font-outfit bg-gray-50 text-gray-800 dark:bg-gray-900 dark:text-white/90">
<header class="sticky top-0 z-10 border-b border-gray-200 bg-white px-4 py-3 dark:border-gray-800 dark:bg-gray-900">
  <div class="flex items-center justify-between gap-3">
    <h1 class="text-theme-xl font-semibold">📡 JobRadar</h1>
  </div>
  <div class="mt-3 flex gap-1" id="periods">
    <button type="button" data-days="1" class="period whitespace-nowrap rounded-lg border border-gray-200 px-3 py-1 text-theme-sm dark:border-gray-800">1 дн.</button>
    <button type="button" data-days="7" class="period whitespace-nowrap rounded-lg border border-gray-200 px-3 py-1 text-theme-sm dark:border-gray-800">7 дн.</button>
    <button type="button" data-days="30" class="period whitespace-nowrap rounded-lg border border-gray-200 px-3 py-1 text-theme-sm dark:border-gray-800">30 дн.</button>
  </div>
  <nav class="mt-3 flex gap-1 overflow-x-auto" id="tabs">
    <button type="button" data-tab="summary" class="tab whitespace-nowrap rounded-lg px-3 py-1 text-theme-sm">Главное</button>
    <button type="button" data-tab="vacancies" class="tab whitespace-nowrap rounded-lg px-3 py-1 text-theme-sm">Вакансии</button>
    <button type="button" data-tab="bot" class="tab whitespace-nowrap rounded-lg px-3 py-1 text-theme-sm">Бот</button>
  </nav>
</header>
<main class="p-4 pb-10" id="main">
  <p class="text-theme-sm text-gray-500 dark:text-gray-400" id="status">Загружаю…</p>
  <div id="content"></div>
</main>
</body>
</html>
